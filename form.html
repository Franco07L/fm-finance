<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080f">
  <title>FM Finance — Registrar</title>

  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>

  <!-- Overlay de configuración (se muestra si no hay URL+token guardados) -->
  <div class="cfg-overlay" id="cfgOverlay" hidden>
    <div class="cfg-card">
      <button class="cfg-x" id="btnCerrarCfg" type="button" aria-label="Cerrar" title="Cerrar">✕</button>
      <h2>Conectar tu cuenta</h2>
      <p class="cfg-help">Pega la <b>URL</b> de tu Apps Script y tu <b>token</b>. Se guardan solo en este dispositivo.</p>
      <label for="cfgUrl">URL de la app web (termina en <span class="mono">/exec</span>)</label>
      <input type="text" id="cfgUrl" class="inp" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off">
      <label for="cfgToken">Token</label>
      <input type="text" id="cfgToken" class="inp" placeholder="fm_..." autocomplete="off">
      <button class="btn-primary" id="btnGuardarCfg">Conectar</button>
      <p class="cfg-estado" id="cfgEstado"></p>
    </div>
  </div>

  <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="brand" aria-label="FM Finance, inicio"><b>FM</b><span>Finance</span></a>
      <nav class="primary-nav" aria-label="Secciones">
        <a href="index.html">Inicio</a>
        <a href="index.html#transacciones">Transacciones</a>
        <a href="index.html#metas">Metas</a>
      </nav>
      <a href="index.html" class="primary header-register"><span data-icon="arrowLeft"></span>Ver resumen</a>
      <div class="header-tools">
        <button class="icon-button" id="btnConfig" title="Configuración" aria-label="Configuración"><span data-icon="settings"></span></button>
      </div>
    </div>
  </header>

  <main class="form-wrap enter">
    <form class="card form-card" id="formTx" autocomplete="off" novalidate>
      <a href="index.html" class="form-back"><span data-icon="arrowLeft"></span>Volver al inicio</a>

      <!-- La ✕ en su PROPIA fila, en flujo normal: nunca se solapa con el toggle -->
      <div class="form-card-head">
        <h1>Nuevo movimiento</h1>
        <a href="index.html" class="btn icon-button form-close" title="Cancelar y volver al dashboard" aria-label="Cancelar y volver al dashboard"><span data-icon="close"></span></a>
      </div>

      <!-- Toggle Gasto / Ingreso -->
      <div class="type-toggle" id="typeToggle" data-kind="gasto" role="group" aria-label="Tipo de movimiento">
        <span class="toggle-thumb" id="toggleThumb" aria-hidden="true"></span>
        <button type="button" class="active" id="btnGasto" aria-pressed="true"><span data-icon="arrowUp"></span>Gasto</button>
        <button type="button" id="btnIngreso" aria-pressed="false"><span data-icon="arrowDown"></span>Ingreso</button>
      </div>

      <!-- Monto -->
      <div class="field-group" style="margin-top:0">
        <label class="field-label" for="inpMonto">Monto en soles</label>
        <div class="amount-field" id="montoBox">
          <span>S/</span>
          <input type="text" id="inpMonto" inputmode="decimal" placeholder="0.00" maxlength="16" aria-describedby="montoHint">
        </div>
        <p class="field-hint" id="montoHint">Usa punto para los decimales.</p>
      </div>

      <!-- Categoría -->
      <div class="field-group">
        <label class="field-label" for="selCategoria">Categoría</label>
        <div class="category-select-wrap" id="catWrap"><span data-icon="other"></span><select id="selCategoria"></select></div>
        <div class="conditional" id="otraWrap" hidden>
          <label class="field-label" for="inpOtraCategoria">Tu categoría</label>
          <input type="text" id="inpOtraCategoria" placeholder="¿Qué categoría? Ej. Mascota" maxlength="70" autocomplete="off">
        </div>
      </div>

      <!-- Descripción -->
      <div class="field-group">
        <label class="field-label" for="inpDescripcion">Descripción <span>· opcional</span></label>
        <textarea id="inpDescripcion" rows="3" placeholder="Ej. Almuerzo en la U"></textarea>
      </div>

      <!-- Fecha -->
      <fieldset class="field-group date-fieldset">
        <legend class="field-label">Fecha</legend>
        <div class="date-choices">
          <label class="date-choice"><input type="radio" name="modoFecha" value="hoy" checked><span data-icon="calendar"></span><span id="lblHoy">Hoy</span></label>
          <label class="date-choice"><input type="radio" name="modoFecha" value="otra"><span data-icon="calendar"></span><span>Otra fecha</span></label>
        </div>
        <div class="conditional" id="fechaWrap" hidden>
          <label class="field-label" for="inpFecha">Fecha del movimiento</label>
          <input type="date" id="inpFecha">
        </div>
      </fieldset>

      <button type="submit" class="primary submit-button" id="btnRegistrar"><span data-icon="plus"></span><span id="btnRegistrarTxt">Registrar gasto</span></button>
    </form>

    <!-- Badge de pendientes offline -->
    <div class="cola-badge" id="colaBadge" hidden>📶 <span id="colaCount">0</span> pendiente(s)</div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/form.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
